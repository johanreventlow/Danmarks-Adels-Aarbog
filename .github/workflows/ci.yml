name: CI

# Håndhæver core- (vitest), web- (vitest+build) og mobil- (jest+tsc) testsuiterne
# på PR + push til main. Tidligere gate var kun Vercels tsc+build → 565 tests
# kørte, men blokerede intet (review 27, T1). Testene er hermetiske: web mocker
# supabase (dummy-env er nok til modul-load-guarden), mobil degraderer til
# offline-seed uden env.
#
# Monorepoet er npm workspaces (packages/core + web + mobile) med ÉN rod-
# package-lock.json — der findes ikke per-app lockfiles, så install + cache
# sker fra roden, og hver suite køres via `npm run ... -w <workspace>`.

on:
  push:
    branches: [main]
  pull_request:

# Nyeste push på en ref annullerer igangværende kørsler på samme ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: core · vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test -w @daa/core
      # Gater @daa/core's typecheck-script (fandtes, men CI kørte det ikke → en
      # tsc-fejl (Koen-type i tree.test.ts) akkumulerede ufanget. Codex-fund F-16).
      - run: npm run typecheck -w @daa/core

  feed:
    name: feed · vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test -w @daa/feed
      - run: npm run typecheck -w @daa/feed

  r:
    name: r · testthat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        id: setup-r
        with:
          use-public-rspm: true
      # duckdb har ingen RSPM-binary og kompileres derfor fra kilde — det tog 41 af
      # jobbets 42 minutter, ved HVER kørsel. Alle øvrige pakker installeres som
      # binaries på under et sekund. Cachen gør den kompilering til en engangsudgift.
      # Bump vN i nøglen når pakkelisten nedenfor ændres.
      - name: Cache R-bibliotek
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-rlib-${{ steps.setup-r.outputs.installed-r-version }}-v1
      # Test-træet er DB-service-frit, men updater-testen sourcer et script, der
      # indlæser RPostgres. Installér derfor alle pakker, som testtræet loader.
      # Kun de manglende installeres, så et cache-hit ikke bygger duckdb igen.
      - name: Installér R-testpakker
        run: |
          Rscript -e 'pkgs <- c("testthat","jsonlite","DBI","duckdb","RPostgres","stringdist","stringi","withr","digest")
            mangler <- setdiff(pkgs, rownames(installed.packages()))
            cat("mangler:", if (length(mangler)) paste(mangler, collapse = ", ") else "ingen", "\n")
            if (length(mangler)) install.packages(mangler)'
      - run: Rscript run-tests.R

  pipeline:
    name: pipeline · unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s .claude/skills/daa-haendelser/scripts -p 'test_*.py'

  evidence-contract:
    name: evidence contract · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --disable-pip-version-check -r .claude/skills/daa-extract/requirements-test.txt
      - run: python3 -m pytest .claude/skills/daa-extract/scripts/test_evidence_contract.py -q

  evidence-promotion-db:
    name: evidence promotion · PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evidence_promotion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d evidence_promotion"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Evidens-promotionens isolerede databasekontrakt
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d evidence_promotion -v ON_ERROR_STOP=1 -f tests/sql/evidence-promotion-bootstrap.sql
          psql -h localhost -U postgres -d evidence_promotion -v ON_ERROR_STOP=1 -f schema.sql
          psql -h localhost -U postgres -d evidence_promotion -v ON_ERROR_STOP=1 -f db-rls.sql
          psql -h localhost -U postgres -d evidence_promotion -v ON_ERROR_STOP=1 -f tests/sql/test-evidence-promotion.sql

  writer-1939-v50-db:
    name: DAA 1939 v50 writer · PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: writer_1939
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d writer_1939"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - run: Rscript -e 'install.packages(c("DBI","RPostgres","jsonlite","digest"))'
      - name: Bootstrap og writer-kontrakt
        env: {PGPASSWORD: postgres}
        run: |
          psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f tests/sql/evidence-promotion-bootstrap.sql
          psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f schema.sql
          psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f db-rls.sql
          psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f tests/sql/1939-v50-writer-bootstrap.sql
          psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f tests/sql/test-1939-v50-production-writer.sql
      - name: Virkelig rollback/apply/reversal integration
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: writer_1939
        run: Rscript tests/integration/test-1939-v50-production-writer.R
      - name: Test DAA 1939 name completion SQL
        env: {PGPASSWORD: postgres}
        run: psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f tests/sql/test-1939-v50-name-completion.sql
      - name: Reimport writer migration from pre-153 ledger
        env: {PGPASSWORD: postgres}
        run: |
          git cat-file -e 2d6aabf^{commit}
          createdb -h localhost -U postgres reimport_legacy_153
          psql -h localhost -U postgres -d reimport_legacy_153 -v ON_ERROR_STOP=1 -f tests/sql/evidence-promotion-bootstrap.sql
          git show 2d6aabf:schema.sql | psql -h localhost -U postgres -d reimport_legacy_153 -v ON_ERROR_STOP=1
          psql -h localhost -U postgres -d reimport_legacy_153 -v ON_ERROR_STOP=1 -f tests/sql/reimport-writer-coexistence-fixture.sql
          if PGOPTIONS='-c app.reimport_writer_atomicity_test_failpoint=on' psql -h localhost -U postgres -d reimport_legacy_153 -v ON_ERROR_STOP=1 -f db-migrations.sql > reimport-atomicity-rollback.out 2>&1; then
            echo "expected late #153 atomicity failure" >&2; exit 1
          fi
          grep -Fq 'REIMPORT_WRITER_ATOMICITY_TEST_FAILURE' reimport-atomicity-rollback.out
          psql -h localhost -U postgres -d reimport_legacy_153 -v ON_ERROR_STOP=1 -v task13_coexistence_expect_rollback=1 -f tests/sql/test-reimport-writer-migration.sql
          psql -h localhost -U postgres -d reimport_legacy_153 -v ON_ERROR_STOP=1 -f db-migrations.sql
          psql -h localhost -U postgres -d reimport_legacy_153 -v ON_ERROR_STOP=1 -f db-rls.sql
          psql -h localhost -U postgres -d reimport_legacy_153 -v ON_ERROR_STOP=1 -v task13_coexistence_expect_success=1 -f tests/sql/test-reimport-writer-migration.sql
          psql -h localhost -U postgres -d reimport_legacy_153 -v ON_ERROR_STOP=1 -f tests/sql/test-1939-v50-c3-apply.sql
          if psql -h localhost -U postgres -d reimport_legacy_153 -v ON_ERROR_STOP=1 -c 'BEGIN' -f tests/sql/reimport-writer-v2-bootstrap.sql > reimport-legacy-v2-bootstrap.out 2>&1; then
            echo "expected historical-ledger v2 bootstrap to fail closed on live cutover inventory" >&2; exit 1
          fi
          grep -Fq 'CUTOVER_INVENTORY_LIVE_DRIFT' reimport-legacy-v2-bootstrap.out
          createdb -h localhost -U postgres reimport_legacy_empty_153
          psql -h localhost -U postgres -d reimport_legacy_empty_153 -v ON_ERROR_STOP=1 -f tests/sql/evidence-promotion-bootstrap.sql
          git show 2d6aabf:schema.sql | psql -h localhost -U postgres -d reimport_legacy_empty_153 -v ON_ERROR_STOP=1
          psql -h localhost -U postgres -d reimport_legacy_empty_153 -v ON_ERROR_STOP=1 -f tests/sql/reimport-writer-legacy-empty-fixture.sql
          psql -h localhost -U postgres -d reimport_legacy_empty_153 -v ON_ERROR_STOP=1 -f db-migrations.sql
          psql -h localhost -U postgres -d reimport_legacy_empty_153 -v ON_ERROR_STOP=1 -f db-rls.sql
          psql -h localhost -U postgres -d reimport_legacy_empty_153 -v ON_ERROR_STOP=1 -f tests/sql/test-reimport-writer.sql
          psql -h localhost -U postgres -d reimport_legacy_empty_153 -v ON_ERROR_STOP=1 -f db-rls.sql
          psql -h localhost -U postgres -d reimport_legacy_empty_153 -v ON_ERROR_STOP=1 -f tests/sql/test-reimport-name-completion.sql
          psql -h localhost -U postgres -d reimport_legacy_empty_153 -v ON_ERROR_STOP=1 -f tests/sql/test-1939-v50-production-writer.sql
          psql -h localhost -U postgres -d reimport_legacy_empty_153 -v ON_ERROR_STOP=1 -f tests/sql/test-1939-v50-name-completion.sql
          psql -h localhost -U postgres -d reimport_legacy_empty_153 -v ON_ERROR_STOP=1 -f tests/sql/run-db-verify-disposable.sql
          psql -h localhost -U postgres -d reimport_legacy_empty_153 -v ON_ERROR_STOP=1 -f tests/sql/test-reimport-edition-catalog.sql
          psql -h localhost -U postgres -d reimport_legacy_empty_153 -At -f tests/sql/inspect-reimport-writer-catalog.sql > reimport-writer-upgraded-catalog.json
          createdb -h localhost -U postgres reimport_fresh_153
          psql -h localhost -U postgres -d reimport_fresh_153 -v ON_ERROR_STOP=1 -f tests/sql/evidence-promotion-bootstrap.sql
          psql -h localhost -U postgres -d reimport_fresh_153 -v ON_ERROR_STOP=1 -f schema.sql
          psql -h localhost -U postgres -d reimport_fresh_153 -v ON_ERROR_STOP=1 -f db-migrations.sql
          psql -h localhost -U postgres -d reimport_fresh_153 -v ON_ERROR_STOP=1 -f db-rls.sql
          psql -h localhost -U postgres -d reimport_fresh_153 -v ON_ERROR_STOP=1 -f tests/sql/run-db-verify-disposable.sql
          psql -h localhost -U postgres -d reimport_fresh_153 -v ON_ERROR_STOP=1 -f tests/sql/test-reimport-edition-catalog.sql
          psql -h localhost -U postgres -d reimport_fresh_153 -At -f tests/sql/inspect-reimport-writer-catalog.sql > reimport-writer-fresh-catalog.json
          cmp reimport-writer-fresh-catalog.json reimport-writer-upgraded-catalog.json
          psql -h localhost -U postgres -d reimport_fresh_153 -v ON_ERROR_STOP=1 -c "ALTER TABLE private.reimport_batch ALTER COLUMN expected_counts DROP NOT NULL"
          psql -h localhost -U postgres -d reimport_fresh_153 -At -f tests/sql/inspect-reimport-writer-catalog.sql > reimport-writer-column-drift-catalog.json
          if cmp -s reimport-writer-fresh-catalog.json reimport-writer-column-drift-catalog.json; then
            echo "writer catalog receipt failed to detect column contract drift" >&2; exit 1
          fi
          for state in issued open finalized; do
            database="reimport_legacy_153_${state}"
            createdb -h localhost -U postgres "$database"
            psql -h localhost -U postgres -d "$database" -v ON_ERROR_STOP=1 -f tests/sql/evidence-promotion-bootstrap.sql
            git show 2d6aabf:schema.sql | psql -h localhost -U postgres -d "$database" -v ON_ERROR_STOP=1
            psql -h localhost -U postgres -d "$database" -v ON_ERROR_STOP=1 -c "INSERT INTO public.source(id,titel,udgave,slags) VALUES(3,'DAA','1939','DAA-udgave'); INSERT INTO private.reimport_1939_authorization(id,operation,manifest_sha256,preview_sha256,database_identity,source_id,expected_counts,authorized_elements,principal_id,nonce,expires_at,status,consumed_at) VALUES('15300000-0000-4000-8000-000000000121','reimport',repeat('a',64),repeat('b',64),current_database(),3,'{}','{}','15300000-0000-4000-8000-000000000107','15300000-0000-4000-8000-000000000122',clock_timestamp()+interval '1 hour',CASE WHEN '$state'='issued' THEN 'issued' ELSE 'consumed' END,CASE WHEN '$state'='issued' THEN NULL ELSE clock_timestamp() END);"
            if [ "$state" = issued ]; then
              :
            else
              psql -h localhost -U postgres -d "$database" -v ON_ERROR_STOP=1 -c "INSERT INTO private.reimport_1939_write_batch(id,authorization_id,manifest_sha256,preview_sha256,principal_id,status,expected_counts,observed_counts,finalized_at) VALUES('15300000-0000-4000-8000-000000000123','15300000-0000-4000-8000-000000000121',repeat('a',64),repeat('b',64),'15300000-0000-4000-8000-000000000107','$state','{}','{}',CASE WHEN '$state'='finalized' THEN clock_timestamp() ELSE NULL END);"
            fi
            if psql -h localhost -U postgres -d "$database" -v ON_ERROR_STOP=1 -f db-migrations.sql > "${database}.out" 2>&1; then
              echo "expected in-flight migration rejection for $state" >&2; exit 1
            fi
            grep -Fq 'REIMPORT_LEGACY_IN_FLIGHT_MIGRATION_BLOCKED' "${database}.out"
            psql -h localhost -U postgres -d "$database" -Atc "SELECT relkind FROM pg_class WHERE oid='private.reimport_1939_authorization'::regclass" | grep -Fx r
          done
          for terminal_case in orphan reversed_finalized_child broken_result ambiguous_child source_record_wrong; do
            database="reimport_legacy_153_${terminal_case}"
            createdb -h localhost -U postgres "$database"
            psql -h localhost -U postgres -d "$database" -v ON_ERROR_STOP=1 -f tests/sql/evidence-promotion-bootstrap.sql
            git show 2d6aabf:schema.sql | psql -h localhost -U postgres -d "$database" -v ON_ERROR_STOP=1
            psql -h localhost -U postgres -d "$database" -v ON_ERROR_STOP=1 -v terminal_negative_case="$terminal_case" -f tests/sql/reimport-writer-legacy-invalid-terminal-fixture.sql
            if psql -h localhost -U postgres -d "$database" -v ON_ERROR_STOP=1 -f db-migrations.sql > "${database}.out" 2>&1; then
              echo "expected terminal-topology migration rejection for $terminal_case" >&2; exit 1
            fi
            grep -Fq 'REIMPORT_LEGACY_IN_FLIGHT_MIGRATION_BLOCKED' "${database}.out"
            psql -h localhost -U postgres -d "$database" -Atc "SELECT relkind FROM pg_class WHERE oid='private.reimport_1939_authorization'::regclass" | grep -Fx r
          done
          for identity_case in identity_wrong_source identity_multi_source; do
            database="reimport_legacy_153_${identity_case}"
            createdb -h localhost -U postgres "$database"
            psql -h localhost -U postgres -d "$database" -v ON_ERROR_STOP=1 -f tests/sql/evidence-promotion-bootstrap.sql
            git show 2d6aabf:schema.sql | psql -h localhost -U postgres -d "$database" -v ON_ERROR_STOP=1
            psql -h localhost -U postgres -d "$database" -v ON_ERROR_STOP=1 -v terminal_negative_case="$identity_case" -f tests/sql/reimport-writer-legacy-invalid-terminal-fixture.sql
            if psql -h localhost -U postgres -d "$database" -v ON_ERROR_STOP=1 -f db-migrations.sql > "${database}.out" 2>&1; then
              echo "expected nonempty legacy source-identity rejection for $identity_case" >&2; exit 1
            fi
            grep -Fq 'REIMPORT_WRITER_LEGACY_SOURCE_IDENTITY_INVALID' "${database}.out"
            psql -h localhost -U postgres -d "$database" -Atc "SELECT relkind FROM pg_class WHERE oid='private.reimport_1939_authorization'::regclass" | grep -Fx r
          done
      - name: Nulstil database til name completion integration
        env: {PGPASSWORD: postgres}
        run: |
          dropdb -h localhost -U postgres writer_1939
          createdb -h localhost -U postgres writer_1939
          psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f tests/sql/evidence-promotion-bootstrap.sql
          psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f schema.sql
          psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f db-rls.sql
          psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f tests/sql/1939-v50-writer-bootstrap.sql
          psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -c 'BEGIN' -f tests/sql/reimport-writer-v2-bootstrap.sql -c 'COMMIT'
          psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f db-rls.sql
      - name: Test DAA 1939 name completion integration
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: writer_1939
        run: Rscript tests/integration/test-1939-v50-name-completion.R
      - name: Generic reimport writer source/profile locking
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: writer_1939
        run: Rscript tests/integration/test-reimport-writer-locking.R

  narrative-record-contract-db:
    name: 'narrative record #152 · PostgreSQL 17'
    runs-on: ubuntu-latest
    env:
      PGDATABASE: narrative_record_152_ci
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: narrative_record_152_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d narrative_record_152_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - name: Installér DBI-racepakker
        run: Rscript -e 'install.packages(c("DBI","RPostgres","processx","bit64","jsonlite","digest"))'
      - name: Bootstrap frisk kontraktdatabase
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/evidence-promotion-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS dblink WITH SCHEMA extensions'
          psql -X -v ON_ERROR_STOP=1 -f schema.sql
          psql -X -v ON_ERROR_STOP=1 -f db-migrations.sql
          psql -X -v ON_ERROR_STOP=1 -f db-rls.sql
      - name: Fokuseret record-kontrakt
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/test-narrative-record-contract.sql
      - name: Nulstil til frisk cutover-kontrakt
        run: |
          dropdb --force narrative_record_152_ci
          createdb narrative_record_152_ci
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/evidence-promotion-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS dblink WITH SCHEMA extensions'
          psql -X -v ON_ERROR_STOP=1 -f schema.sql
          psql -X -v ON_ERROR_STOP=1 -f db-migrations.sql
          psql -X -v ON_ERROR_STOP=1 -f db-rls.sql
      - name: Fokuseret cutover-kontrakt
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/test-narrative-record-cutover.sql
      - name: Nulstil til fuld historisk db-verify
        run: |
          dropdb --force narrative_record_152_ci
          createdb narrative_record_152_ci
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/evidence-promotion-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS dblink WITH SCHEMA extensions'
          psql -X -v ON_ERROR_STOP=1 -f schema.sql
          psql -X -v ON_ERROR_STOP=1 -f db-migrations.sql
          psql -X -v ON_ERROR_STOP=1 -f db-rls.sql
      - name: Fuld historisk db-verify
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/run-db-verify-disposable.sql
      - name: 1939 editions-katalog
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/test-reimport-edition-catalog.sql
      - name: Nulstil til frisk DBI-racedatabase
        run: |
          dropdb --force narrative_record_152_ci
          createdb narrative_record_152_ci
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/evidence-promotion-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS dblink WITH SCHEMA extensions'
          psql -X -v ON_ERROR_STOP=1 -f schema.sql
          psql -X -v ON_ERROR_STOP=1 -f db-migrations.sql
          psql -X -v ON_ERROR_STOP=1 -f db-rls.sql
      - name: Virkelig multi-session DBI-race
        run: Rscript tests/integration/test-narrative-record-concurrency.R

  web:
    name: web · vitest + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Dummy non-tomme creds så supabase.ts's modul-load-guard ikke kaster.
      # Testene rører aldrig nettet (supabase mockes), så værdierne er ligegyldige.
      - name: Skriv dummy Supabase-env
        run: printf 'VITE_SUPABASE_URL=http://localhost:54321\nVITE_SUPABASE_ANON_KEY=dummy-anon-key-for-ci\n' > web/.env.local
      - run: npm run test -w web
      - run: npm run build -w web

  mobile:
    name: mobil · tsc + jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # jest parser ikke alle filer (fx WebView-komponenter uden tests), så en ren
      # jest-kørsel fanger ikke syntaks-/type-fejl i dem — kør tsc eksplicit.
      - run: npm --workspace mobile exec -- tsc --noEmit
      - run: npm test -w mobile
