      - name: Publication-identity SQL (trin 6b · ceremoni C)
        env: {PGPASSWORD: postgres}
        run: psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f tests/sql/test-publication-identity.sql
      - name: Fortrydelse af publication_identity SQL (trin 6b · ceremoni C)
        env: {PGPASSWORD: postgres}
        run: psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f tests/sql/test-publication-reversal.sql
      - name: Legacy migration writer integration (149b)
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: writer_1939
        run: Rscript tests/integration/test-reimport-legacy-migration.R
      # Review 36 D3: C3-identitetens SQL- og to-sessionstests kørte aldrig i CI. De kræver hver sin
      # engangsbase med et bestemt navnepræfiks (daa1939_c3_task9_ / daa1939_c3_identity_task2_), så der
      # bygges én skabelon på migrationsvejen og klones pr. test. deploy-contract afslutter stille med
      # exit 0 uden task3_dsn (psql ignorerer \quit 2), derfor kræves dens OK-linje eksplicit.
      - name: C3-identitet og C3-apply · SQL og to-sessionstests (review 36 D3)
        env: {PGHOST: localhost, PGPORT: 5432, PGUSER: postgres, PGPASSWORD: postgres}
        run: |
          createdb c3_tpl
          for f in tests/sql/evidence-promotion-bootstrap.sql schema.sql db-rls.sql db-migrations.sql db-migrations.sql db-rls.sql; do
            psql -q -d c3_tpl -v ON_ERROR_STOP=1 -f "$f" >/dev/null; done
          createdb -T c3_tpl c3_invariants
          psql -d c3_invariants -v ON_ERROR_STOP=1 -f tests/sql/test-1939-v50-c3-identity-invariants.sql
          createdb -T c3_tpl c3_deploy_contract
          psql -d c3_deploy_contract -v ON_ERROR_STOP=1 \
            -v task3_dsn="dbname=c3_deploy_contract host=localhost port=5432 user=postgres password=postgres" \
            -f tests/sql/test-1939-v50-c3-identity-deploy-contract.sql 2>&1 | tee c3-deploy-contract.log
          grep -q 'OK: C3 identity defaults are cross-writer collision safe' c3-deploy-contract.log
          createdb -T c3_tpl daa1939_c3_task9_ci
          PGDATABASE=daa1939_c3_task9_ci Rscript tests/integration/test-1939-v50-c3-apply.R
          createdb -T c3_tpl daa1939_c3_writer_lock_ci
          PGDATABASE=daa1939_c3_writer_lock_ci Rscript tests/integration/test-1939-v50-c3-writer-lock-order.R
          for t in identity-concurrency identity-delete-lock-order identity-delete-protocol identity-mvcc post-load-lock-order; do
            db="daa1939_c3_identity_task2_${t//-/_}"
            createdb -T c3_tpl "$db"
            PGDATABASE="$db" Rscript "tests/integration/test-1939-v50-c3-$t.R"
          done

  narrative-record-contract-db:
    name: 'narrative record #152 · PostgreSQL 17'
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGDATABASE: narrative_record_152_ci
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: narrative_record_152_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d narrative_record_152_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with: {use-public-rspm: true}
      - name: Installér DBI-racepakker
        run: Rscript -e 'install.packages(c("DBI","RPostgres","processx","bit64","jsonlite","digest"))'
      - name: Bootstrap frisk kontraktdatabase
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/evidence-promotion-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS dblink WITH SCHEMA extensions'
          psql -X -v ON_ERROR_STOP=1 -f schema.sql
          psql -X -v ON_ERROR_STOP=1 -f db-migrations.sql
          psql -X -v ON_ERROR_STOP=1 -f db-rls.sql
      - name: Fokuseret record-kontrakt
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/test-narrative-record-contract.sql
      - name: Feed i bidder (review 37 Y3)
        run: |
          out=$(psql -X -v ON_ERROR_STOP=1 -f tests/sql/test-haendelse-feed.sql)
          grep -qx 'OK test-haendelse-feed' <<<"$out"
      - name: Helpost-regel (trin 6a, schema + migrationer to gange)
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db-migrations.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/test-record-helpost.sql
      - name: Nulstil til frisk cutover-kontrakt
        run: |
          dropdb --force narrative_record_152_ci
          createdb narrative_record_152_ci
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/evidence-promotion-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS dblink WITH SCHEMA extensions'
          psql -X -v ON_ERROR_STOP=1 -f schema.sql
          psql -X -v ON_ERROR_STOP=1 -f db-migrations.sql
          psql -X -v ON_ERROR_STOP=1 -f db-rls.sql
      - name: Fokuseret cutover-kontrakt
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/test-narrative-record-cutover.sql
      - name: Nulstil til fuld historisk db-verify
        run: |
          dropdb --force narrative_record_152_ci
          createdb narrative_record_152_ci
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/evidence-promotion-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS dblink WITH SCHEMA extensions'
          psql -X -v ON_ERROR_STOP=1 -f schema.sql
          psql -X -v ON_ERROR_STOP=1 -f db-migrations.sql
          psql -X -v ON_ERROR_STOP=1 -f db-rls.sql
      - name: Fuld historisk db-verify
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/run-db-verify-disposable.sql
      - name: 1939 editions-katalog
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/test-reimport-edition-catalog.sql
      - name: Nulstil til frisk DBI-racedatabase
        run: |
          dropdb --force narrative_record_152_ci
          createdb narrative_record_152_ci
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/evidence-promotion-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS dblink WITH SCHEMA extensions'
          psql -X -v ON_ERROR_STOP=1 -f schema.sql
          psql -X -v ON_ERROR_STOP=1 -f db-migrations.sql
          psql -X -v ON_ERROR_STOP=1 -f db-rls.sql
      - name: Virkelig multi-session DBI-race
        run: Rscript tests/integration/test-narrative-record-concurrency.R
