name: CI

# Håndhæver core- (vitest), web- (vitest+build) og mobil- (jest+tsc) testsuiterne
# på PR'er. Tidligere gate var kun Vercels tsc+build → 565 tests kørte, men
# blokerede intet (review 27, T1). Testene er hermetiske: web mocker supabase
# (dummy-env er nok til modul-load-guarden), mobil degraderer til offline-seed
# uden env.
#
# Monorepoet er npm workspaces (packages/core + web + mobile) med ÉN rod-
# package-lock.json — der findes ikke per-app lockfiles, så install + cache
# sker fra roden, og hver suite køres via `npm run ... -w <workspace>`.
#
# Actions-minutter (privat repo, gratis-plan: 2000 min/md., hvert job rundes op
# til helt minut): 41 af 100 kørsler var push til main, som gentog PR'ens
# allerede grønne kørsel mod merge-ref'en. Derfor kun pull_request + manuel
# workflow_dispatch; rene docs-PR'er springes over; små jobs er slået sammen,
# så hver kørsel betaler færre afrundinger og færre setup-trin. `[skip ci]` i
# commit-beskeden springer mellemliggende push over.
# Restrisiko: rykker main mellem PR'ens sidste kørsel og merge, er merge-
# resultatet utestet — kør da workflowet manuelt på main.

on:
  pull_request:
    # Kun docs/ og rod-niveau-.md (`*` matcher ikke `/`). IKKE `**/*.md`: CI-
    # testene læser hash-bundne prompt-filer under .claude/skills/*/references/.
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

# Nyeste push på en ref annullerer igangværende kørsler på samme ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: node · core + feed + web + mobil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - id: install
        run: npm ci
      # Suiterne deler ét job for at spare npm ci + minutafrunding, men skal stadig
      # rapportere hver for sig: hvert trin kører selvom et tidligere suite-trin
      # fejlede (kun ikke hvis installationen fejlede).
      - name: core · vitest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test -w @daa/core
      # Gater @daa/core's typecheck-script (fandtes, men CI kørte det ikke → en
      # tsc-fejl (Koen-type i tree.test.ts) akkumulerede ufanget. Codex-fund F-16).
      - name: core · typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck -w @daa/core
      - name: feed · vitest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test -w @daa/feed
      - name: feed · typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck -w @daa/feed
      - name: identity-candidates · vitest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test -w @daa/identity-candidates
      - name: identity-candidates · typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck -w @daa/identity-candidates
      # Dummy non-tomme creds så supabase.ts's modul-load-guard ikke kaster.
      # Testene rører aldrig nettet (supabase mockes), så værdierne er ligegyldige.
      - name: Skriv dummy Supabase-env
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: printf 'VITE_SUPABASE_URL=http://localhost:54321\nVITE_SUPABASE_ANON_KEY=dummy-anon-key-for-ci\n' > web/.env.local
      - name: web · vitest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test -w web
      - name: web · build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build -w web
      - name: web · PostgREST-gate (node:test)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --test web/scripts/verify-public-rpcs.test.mjs
      # jest parser ikke alle filer (fx WebView-komponenter uden tests), så en ren
      # jest-kørsel fanger ikke syntaks-/type-fejl i dem — kør tsc eksplicit.
      - name: mobil · tsc
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm --workspace mobile exec -- tsc --noEmit
      - name: mobil · jest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -w mobile

  r:
    name: r · testthat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        id: setup-r
        with:
          use-public-rspm: true
      # duckdb har ingen RSPM-binary og kompileres derfor fra kilde — det tog 41 af
      # jobbets 42 minutter, ved HVER kørsel. Alle øvrige pakker installeres som
      # binaries på under et sekund. Cachen gør den kompilering til en engangsudgift.
      # Bump vN i nøglen når pakkelisten nedenfor ændres.
      - name: Cache R-bibliotek
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-rlib-${{ steps.setup-r.outputs.installed-r-version }}-v2
      # Test-træet er DB-service-frit, men updater-testen sourcer et script, der
      # indlæser RPostgres. Installér derfor alle pakker, som testtræet loader.
      # Kun de manglende installeres, så et cache-hit ikke bygger duckdb igen.
      - name: Installér R-testpakker
        run: |
          Rscript -e 'pkgs <- c("testthat","jsonlite","yaml","DBI","duckdb","RPostgres","stringdist","stringi","withr","digest")
            mangler <- setdiff(pkgs, rownames(installed.packages()))
            cat("mangler:", if (length(mangler)) paste(mangler, collapse = ", ") else "ingen", "\n")
            if (length(mangler)) install.packages(mangler)'
      - run: Rscript run-tests.R

  python:
    name: python · pipeline unittest + evidence contract pytest
    runs-on: ubuntu-latest
    # Trin 6b's manifest-test kører SQL mod en frisk base (opretter og dropper sin egen t6b_11_*).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env: {PGHOST: localhost, PGPORT: 5432, PGUSER: postgres, PGPASSWORD: postgres}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pipeline · unittest
        run: python3 -m unittest discover -s .claude/skills/daa-haendelser/scripts -p 'test_*.py'
      - id: install
        if: ${{ !cancelled() }}
        run: python3 -m pip install --disable-pip-version-check -r .claude/skills/daa-extract/requirements-test.txt
      - name: evidence contract · pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 -m pytest .claude/skills/daa-extract/scripts/test_evidence_contract.py -q
      - name: evidence builders/runner/comparators · pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 -m pytest .claude/skills/daa-extract/scripts/test_reimport_profile.py .claude/skills/daa-extract/scripts/test_build_source_evidence_rendition.py .claude/skills/daa-extract/scripts/test_build_source_evidence_manifest.py .claude/skills/daa-extract/scripts/test_build_legacy_migration_manifest.py .claude/skills/daa-extract/scripts/test_build_clause_evidence_manifest.py .claude/skills/daa-extract/scripts/test_build_43b_proposal_manifest.py .claude/skills/daa-extract/scripts/test_evidence_runner.py .claude/skills/daa-extract/scripts/test_compare_clause_evidence_projection.py .claude/skills/daa-extract/scripts/test_compare_interpretation_proposal_projection.py .claude/skills/daa-extract/scripts/test_build_45_selection.py .claude/skills/daa-extract/scripts/test_evidence_run_manifest.py .claude/skills/daa-extract/scripts/test_interpretation_decision_sheet.py .claude/skills/daa-extract/scripts/test_decision_sheet_html.py .claude/skills/daa-extract/scripts/test_control_model.py .claude/skills/daa-extract/scripts/test_control_model_v2.py .claude/skills/daa-extract/scripts/test_persona_kort.py .claude/skills/daa-extract/scripts/test_build_clause_ledger.py .claude/skills/daa-extract/scripts/test_clause_segment.py .claude/skills/daa-extract/scripts/test_evidence_extract.py .claude/skills/daa-extract/scripts/test_clause_readers.py .claude/skills/daa-extract/scripts/test_clause_set.py .claude/skills/daa-extract/scripts/test_transfer_pack.py .claude/skills/daa-extract/scripts/test_identity_guard_static.py .claude/skills/daa-extract/scripts/test_identity_decision_sheet.py .claude/skills/daa-extract/scripts/test_relation_persona_extract.py .claude/skills/daa-extract/scripts/test_identity_control_sheet.py .claude/skills/daa-extract/scripts/test_spouse_exception_sheet.py .claude/skills/daa-extract/scripts/test_relation_persona_extract_v2.py .claude/skills/daa-extract/scripts/test_relation_marriage_sheet.py .claude/skills/daa-extract/scripts/test_relation_persona_extract_v3.py .claude/skills/daa-extract/scripts/test_relation_marriage_sheet_v3.py .claude/skills/daa-extract/scripts/test_relation_child_sheet.py .claude/skills/daa-extract/scripts/test_relation_ordinal_sheet.py .claude/skills/daa-extract/scripts/test_transfer_ddl.py .claude/skills/daa-extract/scripts/test_identity_queue_sheet.py .claude/skills/daa-extract/scripts/test_transfer_answers.py .claude/skills/daa-extract/scripts/test_transfer_steps.py .claude/skills/daa-extract/scripts/test_transfer_5ab_content_check.py .claude/skills/daa-extract/scripts/test_build_header_manifest.py .claude/skills/daa-extract/scripts/test_placement_control_sheet.py .claude/skills/daa-extract/scripts/test_segment.py .claude/skills/daa-extract/scripts/test_segment_slaegtled.py .claude/skills/daa-extract/scripts/test_segment_1939.py .claude/skills/daa-extract/scripts/test_build_narrative_revision_manifest.py .claude/skills/daa-extract/scripts/test_build_source_text_revision_manifest.py .claude/skills/daa-extract/scripts/test_publication_persona_manifest.py .claude/skills/daa-extract/scripts/test_publication_identity_sheet.py .claude/skills/daa-extract/scripts/test_build_eligible_selection.py .claude/skills/daa-extract/scripts/test_maal_trin6c1.py .claude/skills/daa-extract/scripts/test_maal_trin6c2.py .claude/skills/daa-extract/scripts/test_normaliser_kandidater.py .claude/skills/daa-extract/scripts/test_model_gennemgang.py .claude/skills/daa-extract/scripts/test_laesertekst_rettelse.py -q

  evidence-promotion-db:
    name: evidence promotion · PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evidence_promotion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d evidence_promotion"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Evidens-promotionens isolerede databasekontrakt
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: evidence_promotion
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/evidence-promotion-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f schema.sql
          psql -v ON_ERROR_STOP=1 -f db-rls.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-evidence-promotion.sql
      - name: Evidens-hardening gennem kumulativ migrationssti
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: evidence_promotion
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/evidence-hardening-pre-migration.sql
          psql -v ON_ERROR_STOP=1 -f db-migrations.sql
          psql -v ON_ERROR_STOP=1 -f db-migrations.sql
          psql -v ON_ERROR_STOP=1 -f db-rls.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-family-id-identity.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-evidence-promotion.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-interpretation-predicate.sql
          python3 .claude/skills/daa-extract/scripts/check_interpretation_predicates.py
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-paastand-rettelse.sql
          bash tests/sql/test-6c2b-kraever-6c2a.sh "$PGDATABASE"
          psql -v ON_ERROR_STOP=1 -f tests/sql/run-db-verify-disposable.sql
      - name: Evidens-hardening på frisk schema-sti
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: evidence_promotion_fresh
        run: |
          createdb "$PGDATABASE"
          psql -v ON_ERROR_STOP=1 -f tests/sql/evidence-promotion-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f schema.sql
          psql -v ON_ERROR_STOP=1 -f db-rls.sql
          psql -v ON_ERROR_STOP=1 -f db-migrations.sql
          psql -v ON_ERROR_STOP=1 -f db-migrations.sql
          psql -v ON_ERROR_STOP=1 -f db-rls.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-evidence-promotion.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-interpretation-promotion-targets.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-interpretation-control-classification.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-transfer-fingerprint-digests.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-transfer-baseline.sql
          bash tests/sql/transfer-decide-bind.sh
          bash tests/sql/test-control-model-v2.sh
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-interpretation-predicate.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-identity-candidates.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-identity-decision.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-identity-detail.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-spouse-review-context.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-relation-party.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-relation-family-context.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-relation-decision.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-relation-binding.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-redaktion-oplysning.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-spouse-exception-projection.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-family-id-identity.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-identity-deceased-context.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-placement-header.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-placement-writer.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-placement-membership.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-person-source-coordinates.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-paastand-rettelse.sql
          bash tests/sql/test-150-ceremoni.sh ci150_ceremoni
          createdb ci5b_2bi_sheet
          for f in tests/sql/evidence-promotion-bootstrap.sql schema.sql db-rls.sql db-migrations.sql db-migrations.sql db-rls.sql; do
            psql -q -v ON_ERROR_STOP=1 -d ci5b_2bi_sheet -f "$f" >/dev/null; done
          bash tests/sql/test-spouse-exception-sheet.sh ci5b_2bi_sheet
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-identity-control-run.sql
          sed -n '/^-- BEGIN 5a-cutover/,/^-- END 5a-cutover/p' db-migrations.sql > /tmp/cutover-5a.sql
          psql -v ON_ERROR_STOP=1 -v cutover=/tmp/cutover-5a.sql -f tests/sql/test-identity-cutover.sql
          python3 .claude/skills/daa-extract/scripts/check_interpretation_predicates.py
          psql -v ON_ERROR_STOP=1 -f tests/sql/run-db-verify-disposable.sql

  interpretation-proposal-db:
    name: interpretation proposal projection · PostgreSQL 17 · begge katalogrækkefølger
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: proposal_projection
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d proposal_projection"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      DAA_PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - run: Rscript -e 'install.packages(c("DBI","RPostgres","jsonlite","digest","testthat"))'
      # Tidligere en matrix med ét job pr. rækkefølge; nu to friske databaser i
      # samme cluster (samme mønster som writer-jobbet). Begge kører, selvom den
      # første fejler.
      - name: Katalogrækkefølge schema-rls-migrations
        run: bash tests/ci/interpretation-proposal-db.sh schema-rls-migrations
      - name: Katalogrækkefølge schema-migrations-rls
        if: ${{ !cancelled() }}
        run: bash tests/ci/interpretation-proposal-db.sh schema-migrations-rls
      # Scriptet skriver hvert trins fulde output til ci-out/<rækkefølge>/; kun
      # syntetiske fixtures, ingen dumps. Uploades kun ved fejl (lager er også budget).
      - name: Upload logs ved fejl
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interpretation-proposal-db-logs
          path: ci-out/
          if-no-files-found: ignore
          retention-days: 7

  writer-1939-v50-db:
    name: DAA 1939 v50 writer · PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: writer_1939
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d writer_1939"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - run: Rscript -e 'install.packages(c("DBI","RPostgres","jsonlite","digest","processx"))'
      - name: Bootstrap og writer-kontrakt
        env: {PGPASSWORD: postgres}
        run: |
          psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f tests/sql/evidence-promotion-bootstrap.sql
          psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f schema.sql
          psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f db-rls.sql
          psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f tests/sql/1939-v50-writer-bootstrap.sql
          psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f tests/sql/test-1939-v50-production-writer.sql
      - name: Profil-seeds (trin 6a) · migrationer to gange på base med source 3 og source 1
        env: {PGPASSWORD: postgres}
        run: |
          psql -q -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -c "INSERT INTO public.source(id,titel,udgave,slags) VALUES(1,'Danmarks Adels Aarbog','2018-20','DAA-udgave') ON CONFLICT(id) DO NOTHING"
          psql -q -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f db-migrations.sql > /dev/null
          psql -q -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f db-migrations.sql > /dev/null
          psql -q -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f db-rls.sql > /dev/null
          psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f tests/sql/test-reimport-profile-seeds.sql
          psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f tests/sql/test-source-text-version.sql
          psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f tests/sql/test-text-revision-dependencies.sql
      - name: Virkelig rollback/apply/reversal integration
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: writer_1939
        run: Rscript tests/integration/test-1939-v50-production-writer.R
      - name: Test DAA 1939 name completion SQL
        env: {PGPASSWORD: postgres}
        run: psql -h localhost -U postgres -d writer_1939 -v ON_ERROR_STOP=1 -f tests/sql/test-1939-v50-name-completion.sql
      - name: Reimport writer migration from pre-153 ledger
        env: {PGPASSWORD: postgres}
        run: |
          git cat-file -e 2d6aabf^{commit}
          createdb -h localhost -U postgres reimport_legacy_153
          psql -h localhost -U postgres -d reimport_legacy_153 -v ON_ERROR_STOP=1 -f tests/sql/evidence-promotion-bootstrap.sql
          git show 2d6aabf:schema.sql | psql -h localhost -U postgres -d reimport_legacy_153 -v ON_ERROR_STOP=1
          psql -h localhost -U postgres -d reimport_legacy_153 -v ON_ERROR_STOP=1 -f tests/sql/reimport-writer-coexistence-fixture.sql
          if PGOPTIONS='-c app.reimport_writer_atomicity_test_failpoint=on' psql -h localhost -U postgres -d reimport_legacy_153 -v ON_ERROR_STOP=1 -f db-migrations.sql > reimport-atomicity-rollback.out 2>&1; then
            echo "expected late #153 atomicity failure" >&2; exit 1
          fi
          grep -Fq 'REIMPORT_WRITER_ATOMICITY_TEST_FAILURE' reimport-atomicity-rollback.out
          psql -h localhost -U postgres -d reimport_legacy_153 -v ON_ERROR_STOP=1 -v task13_coexistence_expect_rollback=1 -f tests/sql/test-reimport-writer-migration.sql
          psql -h localhost -U postgres -d reimport_legacy_153 -v ON_ERROR_STOP=1 -f db-migrations.sql
          psql -h localhost -U postgres -d reimport_legacy_153 -v ON_ERROR_STOP=1 -f db-rls.sql
          psql -h localhost -U postgres -d reimport_legacy_153 -v ON_ERROR_STOP=1 -v task13_coexistence_expect_success=1 -f tests/sql/test-reimport-writer-migration.sql
          psql -h localhost -U postgres -d reimport_legacy_153 -v ON_ERROR_STOP=1 -f tests/sql/test-1939-v50-c3-apply.sql
