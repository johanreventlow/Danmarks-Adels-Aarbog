          psql -v ON_ERROR_STOP=1 -f tests/sql/test-publication-identity.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-publication-reversal.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-interpretation-proposal.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-interpretation-proposal-rerun.sql
          Rscript tests/integration/test-source-text-revision-concurrency.R
          Rscript tests/integration/test-publication-persona-concurrency.R
          Rscript tests/integration/test-record-persona-concurrency.R
          Rscript tests/integration/test-publication-identity-concurrency.R
          # Trin 6c-3a: genbrug af ægtefælle-persona serialiseret pr. kilde (to sessioner via dblink; committer, derfor her).
          psql -v ON_ERROR_STOP=1 -f tests/sql/test-relation-persona-reuse-lock.sql
      - name: Klausul-writer SQL (#148 4.1c)
