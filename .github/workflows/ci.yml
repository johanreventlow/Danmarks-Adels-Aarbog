name: CI

# Håndhæver core- (vitest), web- (vitest+build) og mobil- (jest+tsc) testsuiterne
# på PR + push til main. Tidligere gate var kun Vercels tsc+build → 565 tests
# kørte, men blokerede intet (review 27, T1). Testene er hermetiske: web mocker
# supabase (dummy-env er nok til modul-load-guarden), mobil degraderer til
# offline-seed uden env.
#
# Monorepoet er npm workspaces (packages/core + web + mobile) med ÉN rod-
# package-lock.json — der findes ikke per-app lockfiles, så install + cache
# sker fra roden, og hver suite køres via `npm run ... -w <workspace>`.

on:
  push:
    branches: [main]
  pull_request:

# Nyeste push på en ref annullerer igangværende kørsler på samme ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: core · vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test -w @daa/core
      # Gater @daa/core's typecheck-script (fandtes, men CI kørte det ikke → en
      # tsc-fejl (Koen-type i tree.test.ts) akkumulerede ufanget. Codex-fund F-16).
      - run: npm run typecheck -w @daa/core

  feed:
    name: feed · vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test -w @daa/feed
      - run: npm run typecheck -w @daa/feed

  r:
    name: r · testthat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        id: setup-r
        with:
          use-public-rspm: true
      # duckdb har ingen RSPM-binary og kompileres derfor fra kilde — det tog 41 af
      # jobbets 42 minutter, ved HVER kørsel. Alle øvrige pakker installeres som
      # binaries på under et sekund. Cachen gør den kompilering til en engangsudgift.
      # Bump vN i nøglen når pakkelisten nedenfor ændres.
      - name: Cache R-bibliotek
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-rlib-${{ steps.setup-r.outputs.installed-r-version }}-v1
      # Test-træet er DB-service-frit, men updater-testen sourcer et script, der
      # indlæser RPostgres. Installér derfor alle pakker, som testtræet loader.
      # Kun de manglende installeres, så et cache-hit ikke bygger duckdb igen.
      - name: Installér R-testpakker
        run: |
          Rscript -e 'pkgs <- c("testthat","jsonlite","DBI","duckdb","RPostgres","stringdist","stringi","withr","digest")
            mangler <- setdiff(pkgs, rownames(installed.packages()))
            cat("mangler:", if (length(mangler)) paste(mangler, collapse = ", ") else "ingen", "\n")
            if (length(mangler)) install.packages(mangler)'
      - run: Rscript run-tests.R

  pipeline:
    name: pipeline · unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s .claude/skills/daa-haendelser/scripts -p 'test_*.py'

  web:
    name: web · vitest + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Dummy non-tomme creds så supabase.ts's modul-load-guard ikke kaster.
      # Testene rører aldrig nettet (supabase mockes), så værdierne er ligegyldige.
      - name: Skriv dummy Supabase-env
        run: printf 'VITE_SUPABASE_URL=http://localhost:54321\nVITE_SUPABASE_ANON_KEY=dummy-anon-key-for-ci\n' > web/.env.local
      - run: npm run test -w web
      - run: npm run build -w web

  mobile:
    name: mobil · tsc + jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # jest parser ikke alle filer (fx WebView-komponenter uden tests), så en ren
      # jest-kørsel fanger ikke syntaks-/type-fejl i dem — kør tsc eksplicit.
      - run: npm --workspace mobile exec -- tsc --noEmit
      - run: npm test -w mobile
