name: CI

# Håndhæver core- (vitest), web- (vitest+build) og mobil- (jest+tsc) testsuiterne
# på PR + push til main. Tidligere gate var kun Vercels tsc+build → 565 tests
# kørte, men blokerede intet (review 27, T1). Testene er hermetiske: web mocker
# supabase (dummy-env er nok til modul-load-guarden), mobil degraderer til
# offline-seed uden env.
#
# Monorepoet er npm workspaces (packages/core + web + mobile) med ÉN rod-
# package-lock.json — der findes ikke per-app lockfiles, så install + cache
# sker fra roden, og hver suite køres via `npm run ... -w <workspace>`.

on:
  push:
    branches: [main]
  pull_request:

# Nyeste push på en ref annullerer igangværende kørsler på samme ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  core:
    name: core · vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test -w @daa/core
      # Gater @daa/core's typecheck-script (fandtes, men CI kørte det ikke → en
      # tsc-fejl (Koen-type i tree.test.ts) akkumulerede ufanget. Codex-fund F-16).
      - run: npm run typecheck -w @daa/core

  feed:
    name: feed · vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test -w @daa/feed
      - run: npm run typecheck -w @daa/feed

  r:
    name: r · testthat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # Test-træet er DB-service-frit, men updater-testen sourcer et script, der
      # indlæser RPostgres. Installér derfor alle pakker, som testtræet loader.
      - name: Installér R-testpakker
        run: Rscript -e 'install.packages(c("testthat","jsonlite","DBI","duckdb","RPostgres","stringdist","stringi","withr"))'
      - run: Rscript run-tests.R

  pipeline:
    name: pipeline · unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s .claude/skills/daa-haendelser/scripts -p 'test_*.py'

  web:
    name: web · vitest + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Dummy non-tomme creds så supabase.ts's modul-load-guard ikke kaster.
      # Testene rører aldrig nettet (supabase mockes), så værdierne er ligegyldige.
      - name: Skriv dummy Supabase-env
        run: printf 'VITE_SUPABASE_URL=http://localhost:54321\nVITE_SUPABASE_ANON_KEY=dummy-anon-key-for-ci\n' > web/.env.local
      - run: npm run test -w web
      - run: npm run build -w web

  mobile:
    name: mobil · tsc + jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # jest parser ikke alle filer (fx WebView-komponenter uden tests), så en ren
      # jest-kørsel fanger ikke syntaks-/type-fejl i dem — kør tsc eksplicit.
      - run: npm --workspace mobile exec -- tsc --noEmit
      - run: npm test -w mobile

  implement_media_phase1:
    name: medie fase 1 · implementér + verificér
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 59 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Genopbyg transformer
        shell: bash
        run: |
          cat scripts/.media_phase1/*.zb64 > /tmp/media.zb64
          python - <<'PY'
          import base64
          import zlib
          from pathlib import Path
          target = Path('/tmp/implement_media_phase1.py')
          data = open('/tmp/media.zb64', encoding='utf-8').read().strip()
          target.write_bytes(zlib.decompress(base64.b64decode(data)))
          source = target.read_text(encoding='utf-8')
          source = source.replace('append_once("CHANGELOG.md"', 'append_once("docs/changelog.md"')
          source = source.replace(
              '# Mediehåndtering fase 1 — filside og fuld CRUD: Implementeringsplan',
              '# Mediehåndtering — fase 1: filsiden & fuld CRUD · Implementeringsplan',
          )
          source = source.replace(
              '# Mediehåndtering — robust koncept',
              '# Koncept — Robust mediehåndtering: mediebibliotek, livscyklus & rettigheds-workflow',
          )
          target.write_text(source, encoding='utf-8')
          PY
          python -m py_compile /tmp/implement_media_phase1.py

      - name: Implementér planen
        id: implement
        continue-on-error: true
        shell: bash
        run: |
          python /tmp/implement_media_phase1.py > /tmp/media-phase1-transform.log 2>&1

      - name: Upload transformer-fejl
        if: steps.implement.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: media-phase1-transform-error
          path: /tmp/media-phase1-transform.log
          retention-days: 1

      - name: Stop efter transformer-fejl
        if: steps.implement.outcome == 'failure'
        run: exit 1

      - name: Installér dependencies
        run: npm ci

      - name: Verificér web
        shell: bash
        run: |
          printf 'VITE_SUPABASE_URL=http://localhost:54321\nVITE_SUPABASE_ANON_KEY=dummy-anon-key-for-ci\n' > web/.env.local
          npm run test -w web
          npm run build -w web

      - name: Verificér mobil
        shell: bash
        run: |
          npm --workspace mobile exec -- tsc --noEmit
          npm test -w mobile -- --runInBand

      - name: Commit implementeringen og ryd engangsfiler
        shell: bash
        run: |
          rm -rf scripts/.media_phase1
          rm -f .github/workflows/implement-media-phase1.yml
          git show "${{ github.event.pull_request.base.sha }}:.github/workflows/ci.yml" > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(media): implementér filside og fuld CRUD"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
