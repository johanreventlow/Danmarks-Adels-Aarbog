      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: narrative_record_152_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d narrative_record_152_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
