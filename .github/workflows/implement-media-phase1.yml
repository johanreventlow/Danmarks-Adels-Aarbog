name: Implement media phase 1

on:
  push:
    branches:
      - claude/image-media-handling-analysis-kd4xx3

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rebuild transformer
        shell: bash
        run: |
          cat scripts/.media_phase1/*.zb64 > /tmp/media.zb64
          python - <<'PY'
          import base64
          import zlib
          data = open('/tmp/media.zb64', encoding='utf-8').read().strip()
          open('/tmp/implement_media_phase1.py', 'wb').write(zlib.decompress(base64.b64decode(data)))
          PY
          python -m py_compile /tmp/implement_media_phase1.py

      - name: Apply implementation
        run: python /tmp/implement_media_phase1.py

      - name: Install dependencies
        run: npm ci

      - name: Web tests
        run: npm --workspace web run test

      - name: Web build
        run: npm --workspace web run build

      - name: Mobile tests
        run: npm --workspace mobile run test -- --runInBand

      - name: Mobile typecheck
        run: npx tsc -p mobile/tsconfig.json --noEmit

      - name: Commit implementation
        shell: bash
        run: |
          rm -rf scripts/.media_phase1
          rm -f .github/workflows/implement-media-phase1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(media): implementér filside og fuld CRUD"
          git push
